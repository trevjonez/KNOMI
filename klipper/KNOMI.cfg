# Klipper config for this KNOMI fork.
#
# Superset of BTT's stock KNOMI.cfg: the same five wrappers that drive the
# display's state flags, plus two optional additions this fork can use. Drop-in
# replacement -- if you are running stock KNOMI.cfg today, this changes nothing
# about how the flags behave.
#
#     [include KNOMI.cfg]
#
# The two additions are optional. Without them the firmware falls back to
# compiled-in defaults and still animates, just less accurately and at Klipper's
# stock 4Hz. See docs/toolhead-scene.md.
#
# Machine-specific integration -- status LEDs, probe workflows, adaptive
# meshing -- deliberately does NOT live here. Wrap or extend these macros in
# your own config rather than editing this file, so it stays diffable against
# upstream.

[gcode_macro _KNOMI_STATUS]
variable_homing: False
variable_probing: False
variable_qgling: False
variable_heating_nozzle: False
variable_heating_bed: False
# Klipper status refresh period to use while the KNOMI is animating, seconds.
# Only used if knomi_query_refresh is installed. 0.10 is the measured knee on a
# Pi 4: 0.25 -> 0.10 more than doubles the display's update rate for ~45% more
# klippy CPU, while 0.10 -> 0.05 buys 15% more for another 22%.
variable_animate_period: 0.10
gcode:

# Raise Klipper's status refresh rate while the KNOMI is showing an animated
# state, and put it back when it is not. No-op unless knomi_query_refresh is
# installed.
#
# Derived from the flags rather than paired set/reset calls, because these
# operations nest: QUAD_GANTRY_LEVEL homes on the way in if the machine is not
# homed, and the inner G28's reset would otherwise drop the rate back while the
# outer level is still running. Recomputing from the flags is idempotent, so it
# does not matter how many times or in what order it runs.
[gcode_macro _KNOMI_QUERY_RATE]
gcode:
    {% set k = printer['gcode_macro _KNOMI_STATUS'] %}
    {% if printer.configfile.settings.knomi_query_refresh is defined %}
        {% if k.homing or k.probing or k.qgling %}
            SET_QUERY_REFRESH PERIOD={k.animate_period}
        {% else %}
            SET_QUERY_REFRESH RESET=1
        {% endif %}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    _KNOMI_QUERY_RATE
    G28.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
    _KNOMI_QUERY_RATE

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    _KNOMI_QUERY_RATE
    BTT_BED_MESH_CALIBRATE {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False
    _KNOMI_QUERY_RATE

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BTT_QUAD_GANTRY_LEVEL
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
    _KNOMI_QUERY_RATE
    BTT_QUAD_GANTRY_LEVEL {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
    _KNOMI_QUERY_RATE

## For a printer with Z_TILT instead of QGL, replace the block above with this.
## The KNOMI has no separate gantry-level state -- qgling IS it.
#[gcode_macro QUAD_GANTRY_LEVEL]
#gcode:
#    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
#    _KNOMI_QUERY_RATE
#    Z_TILT_ADJUST {rawparams}
#    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
#    _KNOMI_QUERY_RATE

# ---------------------------------------------------------------------------
# Optional: publish homing geometry so the display need not assume it.
#
# While an axis is unhomed Klipper reports a fictitious position, and the
# firmware reconstructs the real one from it (docs/toolhead-scene.md). To spot
# the moment the endstop trips it needs a plausible homing speed. Publishing it
# from the live config means retuning the printer needs no reflash.
#
# Every read is guarded: position_endstop is absent on a probe-homed axis, and
# homing_speed has a Klipper default.
# ---------------------------------------------------------------------------
[gcode_macro _KNOMI_HOME_INFO]
variable_ready: False
variable_x_home: 0.0
variable_y_home: 0.0
variable_x_speed: 0.0
variable_y_speed: 0.0
variable_z_speed: 0.0
gcode:

[delayed_gcode _KNOMI_HOME_INFO_INIT]
initial_duration: 2
gcode:
    {% set cf = printer.configfile.settings %}
    {% set sx = cf['stepper_x'] %}
    {% set sy = cf['stepper_y'] %}
    {% set sz = cf['stepper_z'] %}
    SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=x_home VALUE={sx.get('position_endstop', sx.get('position_max', 0.0))|float}
    SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=y_home VALUE={sy.get('position_endstop', sy.get('position_max', 0.0))|float}
    SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=x_speed VALUE={sx.get('homing_speed', 5.0)|float}
    SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=y_speed VALUE={sy.get('homing_speed', 5.0)|float}
    SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=z_speed VALUE={sz.get('homing_speed', 5.0)|float}
    SET_GCODE_VARIABLE MACRO=_KNOMI_HOME_INFO VARIABLE=ready VALUE=True

# Optional: enables SET_QUERY_REFRESH, used by _KNOMI_QUERY_RATE above.
# Requires knomi_query_refresh.py symlinked into klipper/klippy/extras/.
#[knomi_query_refresh]
